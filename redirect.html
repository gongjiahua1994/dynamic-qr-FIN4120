<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>验证中...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f6fa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 40px 32px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 420px;
      width: 100%;
    }
    .icon {
      font-size: 56px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 22px;
      color: #333;
      margin-bottom: 12px;
    }
    p {
      color: #666;
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 8px;
      white-space: pre-line;
    }
    .detail {
      color: #999;
      font-size: 13px;
      margin-top: 16px;
      white-space: pre-line;
    }
    .spinner {
      display: inline-block;
      width: 36px;
      height: 36px;
      border: 3px solid #e0e0e0;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .expired { color: #c62828; }
    .success { color: #2e7d32; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon" id="icon">⏳</div>
    <h1 id="title">正在验证二维码... / Verifying QR code...</h1>
    <p id="message">请稍候 / Please wait</p>
    <p class="detail" id="detail"></p>
  </div>

  <script>
    // ============== 配置区（必须与 index.html 保持一致） ==============
    // 老师的问卷星 Quiz 链接
    const QUIZ_URL = 'https://ks.wjx.com/vm/rbkF0pE.aspx#';

    // 签名密钥：必须与 index.html 中的 SECRET 完全一致
    const SECRET = 'a3f7b2c9d4e1f8a6b5c0d3e7f9a2b1c8d4e6f0a3b7c9d2e5f8a1c4b7d0e3f6a9';

    // 有效时间窗口（秒）。二维码每 5 秒刷新，这里给 10 秒窗口，
    // 使得每个二维码在刷新后仍有 5 秒重叠有效期，避免网速慢导致
    // 学生扫码后页面加载完成时已过期。
    const VALID_WINDOW = 10;
    // ============================================================

    const iconEl = document.getElementById('icon');
    const titleEl = document.getElementById('title');
    const messageEl = document.getElementById('message');
    const detailEl = document.getElementById('detail');

    // ===== 纯 JS SHA-256 + HMAC（不依赖 crypto.subtle，任何环境可用） =====
    function sha256Bytes(msg) {
      function rotr(x, n) { return (x >>> n) | (x << (32 - n)); }
      function add(x, y) {
        var lsw = (x & 0xffff) + (y & 0xffff);
        var msw = (x >> 16) + (y >> 16) + (lsw >> 16);
        return (msw << 16) | (lsw & 0xffff);
      }
      var K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
      var H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
      var bytes = [];
      for (var i = 0; i < msg.length; i++) bytes.push(msg.charCodeAt(i) & 0xff);
      var bitLen = bytes.length * 8;
      bytes.push(0x80);
      while (bytes.length % 64 !== 56) bytes.push(0);
      for (var i = 7; i >= 0; i--) bytes.push((bitLen / Math.pow(2, i * 8)) & 0xff);
      for (var i = 0; i < bytes.length; i += 64) {
        var w = new Array(64);
        for (var j = 0; j < 16; j++)
          w[j] = (bytes[i+j*4]<<24)|(bytes[i+j*4+1]<<16)|(bytes[i+j*4+2]<<8)|bytes[i+j*4+3];
        for (var j = 16; j < 64; j++) {
          var s0 = rotr(w[j-15],7)^rotr(w[j-15],18)^(w[j-15]>>>3);
          var s1 = rotr(w[j-2],17)^rotr(w[j-2],19)^(w[j-2]>>>10);
          w[j] = add(add(add(w[j-16],s0),w[j-7]),s1);
        }
        var a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
        for (var j = 0; j < 64; j++) {
          var S1 = rotr(e,6)^rotr(e,11)^rotr(e,25);
          var ch = (e&f)^(~e&g);
          var t1 = add(add(add(add(h,S1),ch),K[j]),w[j]);
          var S0 = rotr(a,2)^rotr(a,13)^rotr(a,22);
          var maj = (a&b)^(a&c)^(b&c);
          var t2 = add(S0,maj);
          h=g;g=f;f=e;e=add(d,t1);d=c;c=b;b=a;a=add(t1,t2);
        }
        H[0]=add(H[0],a);H[1]=add(H[1],b);H[2]=add(H[2],c);H[3]=add(H[3],d);
        H[4]=add(H[4],e);H[5]=add(H[5],f);H[6]=add(H[6],g);H[7]=add(H[7],h);
      }
      var out = '';
      for (var i = 0; i < 8; i++)
        for (var j = 3; j >= 0; j--)
          out += String.fromCharCode((H[i] >>> (j*8)) & 0xff);
      return out;
    }
    function bytesToHex(s) {
      var h = '';
      for (var i = 0; i < s.length; i++) {
        var b = s.charCodeAt(i);
        h += (b < 16 ? '0' : '') + b.toString(16);
      }
      return h;
    }
    function hmacSha256(key, message) {
      var blockSize = 64;
      if (key.length > blockSize) key = sha256Bytes(key);
      while (key.length < blockSize) key += '\x00';
      var oKey = '', iKey = '';
      for (var i = 0; i < blockSize; i++) {
        oKey += String.fromCharCode(key.charCodeAt(i) ^ 0x5c);
        iKey += String.fromCharCode(key.charCodeAt(i) ^ 0x36);
      }
      var inner = sha256Bytes(iKey + message);
      return bytesToHex(sha256Bytes(oKey + inner));
    }

    function verify(ts, sig) {
      const expectedHex = hmacSha256(SECRET, String(ts));
      // 恒定时间比较，避免时序攻击
      if (expectedHex.length !== sig.length) return false;
      let diff = 0;
      for (let i = 0; i < expectedHex.length; i++) {
        diff |= expectedHex.charCodeAt(i) ^ sig.charCodeAt(i);
      }
      return diff === 0;
    }

    async function main() {
      const params = new URLSearchParams(window.location.search);
      const tsStr = params.get('ts');
      const sig = params.get('sig') || '';

      // 缺参数
      if (!tsStr || !sig) {
        iconEl.textContent = '❌';
        titleEl.textContent = '二维码无效 / Invalid QR code';
        titleEl.className = 'expired';
        messageEl.textContent = '二维码参数不完整，请重新扫描老师投影上的最新二维码。\nIncomplete QR code. Please scan the latest code on the projector.';
        return;
      }

      const ts = parseInt(tsStr, 10);
      if (isNaN(ts)) {
        iconEl.textContent = '❌';
        titleEl.textContent = '二维码无效 / Invalid QR code';
        titleEl.className = 'expired';
        messageEl.textContent = '时间戳格式错误。\nInvalid timestamp format.';
        return;
      }

      try {
        // 1. 校验签名（防止学生篡改时间戳伪造有效二维码）
        const valid = verify(ts, sig);
        if (!valid) {
          iconEl.textContent = '🚫';
          titleEl.textContent = '二维码被篡改 / QR code tampered';
          titleEl.className = 'expired';
          messageEl.textContent = '签名校验失败，该二维码可能被修改过。请重新扫描最新二维码。\nSignature verification failed. The QR code may have been altered. Please scan the latest code.';
          detailEl.textContent = '如持续出现此问题，请联系老师。\nIf this persists, please contact your instructor.';
          return;
        }

        // 2. 校验时间窗口（防止使用旧二维码截图）
        const now = Date.now();
        const elapsed = (now - ts) / 1000;
        if (elapsed > VALID_WINDOW) {
          iconEl.textContent = '⏰';
          titleEl.textContent = '二维码已过期 / QR code expired';
          titleEl.className = 'expired';
          messageEl.textContent = `该二维码生成于 ${Math.floor(elapsed)} 秒前，已超过有效期（${VALID_WINDOW} 秒）。\nThis code was generated ${Math.floor(elapsed)} seconds ago and has expired (valid for ${VALID_WINDOW}s).`;
          detailEl.textContent = '请让老师刷新后，重新扫描投影上最新的二维码。\nPlease ask your instructor to refresh, then scan the latest code.';
          return;
        }

        // 未来时间的二维码（时钟差异或伪造）
        if (elapsed < -5) {
          iconEl.textContent = '⚠️';
          titleEl.textContent = '二维码时间异常 / Time mismatch';
          titleEl.className = 'expired';
          messageEl.textContent = '二维码时间与当前时间不符，请重新扫描。\nThe QR code timestamp does not match the current time. Please scan again.';
          return;
        }

        // 3. 验证通过，跳转到问卷星 Quiz
        iconEl.textContent = '✅';
        titleEl.textContent = '验证通过 / Verified';
        titleEl.className = 'success';
        messageEl.textContent = '正在跳转到 Quiz 页面... / Redirecting to Quiz...';
        detailEl.textContent = `（剩余有效时间 / Time left: ${(VALID_WINDOW - elapsed).toFixed(1)} 秒 / s）`;
        // 短暂延迟让用户看到"验证通过"
        setTimeout(() => { window.location.href = QUIZ_URL; }, 600);
      } catch (e) {
        console.error(e);
        iconEl.textContent = '❌';
        titleEl.textContent = '验证出错 / Verification error';
        titleEl.className = 'expired';
        messageEl.textContent = '验证过程发生错误，请重新扫描。\nAn error occurred during verification. Please scan again.';
        detailEl.textContent = '错误信息 / Error: ' + e.message;
      }
    }

    main();
  </script>
</body>
</html>
